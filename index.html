      vaguer one that stays true.

    <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","name":"Haply","url":"https://happilyeverafteragain.com","logo":"https://happilyeverafteragain.com/icons/icon-512.png","slogan":"Divorced. Not done.","description":"A free community for people who are divorced or legally separated, 21 and over.","email":"support@happilyeverafteragain.com"},{"@type":"WebSite","name":"Haply","url":"https://happilyeverafteragain.com","description":"A free community for divorced and legally separated people aged 21 and over, with optional divorce verification and dating in Chicago."},{"@type":"MobileApplication","name":"Haply","operatingSystem":"iOS, Android, Web","applicationCategory":"SocialNetworkingApplication","description":"Community and support for divorced and legally separated people, 21+. Free to join anywhere in the US; dating open in Chicago.","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Who can join Haply?","acceptedAnswer":{"@type":"Answer","text":"People aged 21 and over who are divorced or legally separated. Joining is free and takes a minute."}},{"@type":"Question","name":"Is Haply free?","acceptedAnswer":{"@type":"Answer","text":"Yes. Joining, posting, city groups, and divorce verification are all free, anywhere in the US. A paid option exists for one dating feature — seeing who has already liked you — and community membership stays free."}},{"@type":"Question","name":"Where is Haply available?","acceptedAnswer":{"@type":"Answer","text":"The community is open across the United States and is useful wherever you live. Dating is currently open in Chicago only, deliberately: a dating pool spread across many cities is empty in all of them. Members elsewhere can join the waitlist, which is what decides the next city."}},{"@type":"Question","name":"What does a verified badge mean on Haply?","acceptedAnswer":{"@type":"Answer","text":"A member has
