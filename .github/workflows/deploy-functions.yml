name: Deploy Supabase Edge Functions

# The Pages workflow only ships the React app. Edge functions live outside that
# build, so without this they can only be deployed by hand from the dashboard.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy matchmaker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ignlircqmifvmxnmwjks
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set — skipping."
            echo "Add it under Settings -> Secrets and variables -> Actions to enable this."
            exit 0
          fi
          npx --yes supabase@latest functions deploy matchmaker --project-ref "$PROJECT_REF"
